spring.application.name=tasktracker

# Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/task_tracker}
spring.datasource.username=${DB_USER:task_user}
spring.datasource.password=${DB_PASSWORD:task_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Properties and Schema Init
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret
jwt.secret=${JWT_SECRET:94a08da1fecbb6e8b46990538c7b50b2b8106f2e2d094ebfa2cb233ab3631f42}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Server port
server.port=8080
